[project]
name = "event-driven-document-processor"
version = "0.1.0"
description = "Event-driven document processing system using FastAPI and AWS-compatible services"
readme = "README.md"
authors = [
    { name = "RoCalderon1405", email = "rocalderon1405@hotmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.40,<2",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.11",
    "boto3-stubs[dynamodb,s3]>=1.40,<2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "event_driven_document_processor.main:app"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["floci: requires explicit RUN_FLOCI_TESTS=1 and a running Floci service"]
