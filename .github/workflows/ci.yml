name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Tests
        run: npm run test:coverage
      - name: Production build
        run: npm run build
      - name: Save frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Locked dependencies, tests, lint and formatting
        run: python infra/ci/run.py quality
        timeout-minutes: 8
      - name: Save Python coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage/python.lcov
          if-no-files-found: error
          retention-days: 7

  coveralls:
    name: Coveralls reporting
    needs: [quality, frontend]
    # Forks still generate reports, but never send their source/coverage to a third party.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: Report Python and frontend coverage together
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          github-token: ${{ github.token }}
          files: coverage/python.lcov coverage/lcov.info
          format: lcov
          coverage-reporter-version: v0.6.22

  docker:
    name: Docker integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      # Only disposable GitHub-hosted runners: Floci's Lambda emulator controls Docker.
      - name: Isolated builds, regression, compatibility and real events
        run: python infra/ci/run.py docker
        timeout-minutes: 30
      - name: Clean up this run only
        if: always()
        run: python infra/ci/run.py cleanup
        timeout-minutes: 3
